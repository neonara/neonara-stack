name: Neonara Stack CI/CD

# ─────────────────────────────────────────────────────────────────────────────
# CI/CD pipeline (backend + frontend)
#
#   CI   1. Backend  · Lint & Types        (black, isort, flake8, mypy)
#        2. Backend  · Tests & Coverage     (pytest + migrations check + Postgres)
#        3. Frontend · Lint & Types         (eslint, tsc)
#        4. Frontend · Unit Tests           (vitest)
#        5. Frontend · Build                (next build)
#        6. Security · Scan                 (trivy, bandit, safety, pip-audit, npm audit)
#   CD   7. Image    · Build & Push (GHCR)  (backend production image only —
#                                            no frontend Dockerfile exists yet)
#        8. Deploy   · SSH                  (pull image + compose up + health check)
#
# Quality/test/build/scan steps are advisory (continue-on-error) so the
# pipeline stays green while this template is still being fleshed out. The
# release gates — image build/push and deploy — are strict.
#
# Branch scope: pushes to any branch run Stages 1-4 (lint + tests) and Stage 6
# (security scan) for fast feedback. Stages 5 and 7 (frontend build, image
# build) only run on pushes to main, or on any pull_request into main. Stage 8
# (deploy) is gated to main pushes only.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege default token; jobs opt into more (e.g. packages: write).
permissions:
  contents: read

# Cancel superseded runs — except on main, so a production deploy is never
# interrupted mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Stage 1 ──────────────────────────────────────────────────────────────
  backend-quality:
    name: "Stage 1 · Backend Lint & Types"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-lint-secret-key
      POSTGRES_DB: ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        run: pip install -r requirements/test.txt
      # Lint/type tools aren't in any requirements file yet — installed ad hoc
      # here. Add them to requirements/development.txt if you want them
      # available locally too.
      - name: Install lint tools
        run: pip install black isort flake8 mypy django-stubs djangorestframework-stubs
      # Advisory quality gates (soft) while formatting/type debt is paid down.
      - name: black (format check)
        run: black --check .
        continue-on-error: true
      - name: isort (import order)
        run: isort --check-only apps core config
        continue-on-error: true
      - name: flake8 (lint)
        run: flake8 apps core config
        continue-on-error: true
      - name: mypy (type check)
        run: mypy apps core
        continue-on-error: true

  # ── Stage 2 ──────────────────────────────────────────────────────────────
  backend-tests:
    name: "Stage 2 · Backend Tests & Coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend-quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neonara
          POSTGRES_PASSWORD: neonara
          POSTGRES_DB: neonara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neonara -d neonara"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-test-secret-key
      POSTGRES_DB: neonara
      POSTGRES_USER: neonara
      POSTGRES_PASSWORD: neonara
      DB_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        run: pip install -r requirements/test.txt
      - name: Missing-migration check
        run: python manage.py makemigrations --check --dry-run
        continue-on-error: true
      - name: Run pytest
        run: pytest -p no:cacheprovider --cov=apps --cov=core --cov-report=xml --cov-report=term-missing
        continue-on-error: true
      - name: Coverage gate (advisory)
        run: coverage report --fail-under=80
        continue-on-error: true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ── Stage 3 ──────────────────────────────────────────────────────────────
  frontend-quality:
    name: "Stage 3 · Frontend Lint & Types"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: ESLint
        run: npm run lint
        continue-on-error: true
      - name: TypeScript (tsc --noEmit)
        run: npm run type-check
        continue-on-error: true

  # ── Stage 4 ──────────────────────────────────────────────────────────────
  frontend-tests:
    name: "Stage 4 · Frontend Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: frontend-quality
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Vitest
        run: npx vitest run --passWithNoTests

  # ── Stage 5 ──────────────────────────────────────────────────────────────
  frontend-build:
    name: "Stage 5 · Frontend Build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend-quality
    if: github.event_name == 'pull_request' || github.ref_name == 'main'
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_SESSION_SECRET: ci-session-secret
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Next.js build
        run: npm run build
        continue-on-error: true

  # ── Stage 6 ──────────────────────────────────────────────────────────────
  # Runs on every branch push (not just main), catches vulnerable deps early.
  security-scan:
    name: "Stage 6 · Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (vulns + secrets + misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0" # report only — never blocks
        continue-on-error: true
      - name: bandit (Python SAST)
        run: |
          python -m pip install --quiet bandit
          bandit -r backend/apps backend/core backend/config \
            -x "*/migrations/*,*/tests/*" || true
        continue-on-error: true
      - name: safety (Python dependency CVE scan)
        run: |
          python -m pip install --quiet "safety<3"
          safety check -r backend/requirements/production.txt || true
        continue-on-error: true
      - name: pip-audit (backend dependencies)
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r backend/requirements/production.txt || true
        continue-on-error: true
      - name: npm audit (frontend dependencies)
        run: npm audit --prefix frontend --audit-level=high || true
        continue-on-error: true

  # ── Stage 7 ──────────────────────────────────────────────────────────────
  image-build:
    name: "Stage 7 · Build & Push Image (GHCR)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'pull_request' || github.ref_name == 'main'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute image ref (GHCR, lowercased owner)
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          name="ghcr.io/${owner}/neonara-backend"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "ref=${name}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          # Build on every run; push only on real pushes (not PRs).
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Stage 8 ──────────────────────────────────────────────────────────────
  deploy:
    name: "Stage 8 · Deploy (SSH)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: image-build
    # Deploy only on direct pushes to main (never on PRs).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    # Serialize deploys; never cancel one in progress.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # Secrets cannot be read inside `if:`, so resolve readiness in a step.
      - name: Check deploy target
        id: cfg
        run: |
          if [ -n "${{ secrets.SSH_HOST }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No SSH_HOST secret configured — deploy runs in dry-run mode."
          fi
      - name: Deploy to server over SSH
        if: steps.cfg.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ${{ needs.image-build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: BACKEND_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            git pull --ff-only

            # Authenticate to GHCR if the image is private.
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            fi

            export BACKEND_IMAGE
            COMPOSE="docker compose -f docker-compose.yml --env-file .env"

            # Pull the exact CI-built image and roll the backend services.
            $COMPOSE pull django_api celery_worker celery_beat
            $COMPOSE up -d --no-build django_api celery_worker celery_beat

            # Run shared migrations and refresh static assets.
            $COMPOSE exec -T django_api python manage.py migrate_schemas --shared
            $COMPOSE exec -T django_api python manage.py collectstatic --noinput

            # Health check — fail the deploy if the API does not come up.
            for i in $(seq 1 10); do
              if curl -fsS http://localhost:8000/api/health/ >/dev/null; then
                echo "✅ Health check passed."
                exit 0
              fi
              echo "Waiting for API to become healthy ($i/10)…"
              sleep 6
            done
            echo "❌ Health check failed after deploy." >&2
            exit 1
      - name: Deploy summary
        run: |
          if [ "${{ steps.cfg.outputs.ready }}" = "true" ]; then
            echo "✅ Deployed image ${{ needs.image-build.outputs.image }} to ${{ secrets.SSH_HOST }}."
          else
            echo "ℹ️ Dry-run: no SSH secrets set."
            echo "Enable real deploys by adding repo secrets:"
            echo "  SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_PORT, DEPLOY_PATH"
            echo "  GHCR_TOKEN (read:packages) — only if the image is private"
          fi
